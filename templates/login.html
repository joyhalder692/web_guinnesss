
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sign In - Web Guinness</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>

        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f7fb;
            padding: 40px 20px;
        }

        .auth-card {
            width: 100%;
            max-width: 430px;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.08);
        }

        .auth-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 28px;
        }

        .auth-logo-symbol {
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #2563eb;
            color: white;
            border-radius: 10px;
            font-size: 22px;
            font-weight: 700;
        }

        .auth-logo-name {
            font-size: 22px;
            font-weight: 700;
            color: #111827;
        }

        .auth-heading {
            text-align: center;
            margin-bottom: 8px;
            font-size: 28px;
            color: #111827;
        }

        .auth-subtitle {
            text-align: center;
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .auth-error {
            background: #fef2f2;
            color: #dc2626;
            border: 1px solid #fecaca;
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #374151;
        }

        .form-group input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
            box-sizing: border-box;
        }

        .form-group input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .signin-button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .signin-button:hover {
            background: #1d4ed8;
        }

        .auth-footer {
            text-align: center;
            margin-top: 24px;
            color: #6b7280;
            font-size: 14px;
        }

        .auth-footer a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .back-home {
            text-align: center;
            margin-top: 18px;
        }

        .back-home a {
            color: #6b7280;
            text-decoration: none;
            font-size: 13px;
        }

        .back-home a:hover {
            color: #2563eb;
        }

        @media (max-width: 500px) {

            .auth-card {
                padding: 28px 22px;
            }

            .auth-heading {
                font-size: 24px;
            }

        }

    </style>

</head>


<body>

    <main class="auth-page">

        <div class="auth-card">

            <!-- LOGO -->

            <div class="auth-logo">

                <div class="auth-logo-symbol">
                    W
                </div>

                <div class="auth-logo-name">
                    Web Guinness
                </div>

            </div>


            <!-- HEADING -->

            <h1 class="auth-heading">
                Welcome Back
            </h1>

            <p class="auth-subtitle">
                Sign in to continue to Web Guinness
            </p>


            <!-- ERROR MESSAGE -->

            {% if error %}

            <div class="auth-error">
                {{ error }}
            </div>

            {% endif %}


            <!-- LOGIN FORM -->

            <form method="POST"
                  action="{{ url_for('login') }}">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required>

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required>

                </div>


                <button
                    type="submit"
                    class="signin-button">

                    Sign In

                </button>

            </form>


            <!-- REGISTER -->

            <div class="auth-footer">

                Don't have an account?

                <a href="{{ url_for('register') }}">
                    Create an account
                </a>

            </div>


            <!-- HOME -->

            <div class="back-home">

                <a href="{{ url_for('home') }}">
                    ← Back to Web Guinness
                </a>

            </div>

        </div>

    </main>

</body>

</html>
